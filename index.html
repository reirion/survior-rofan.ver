// 범위 공격
// ========================================
function triggerSplashDamage(
    x,
    y,
    radius,
    splashDmg,
    mainTarget
) {
    createParticles(x, y, '#ff8800', 6);

    enemies.forEach(e => {
        if (e !== mainTarget) {
            let r = e.isBoss ? 28 : e.tier.radius;

            if (
                Math.hypot(x - e.x, y - e.y) <
                radius + r
            ) {
                e.hp -= splashDmg;

                createDamageText(
                    e.x,
                    e.y,
                    Math.round(splashDmg),
                    '#ffaa44'
                );
            }
        }
    });
}


// ========================================
// 연쇄 번개 공격
// ========================================
function triggerChain(startEnemy) {
    let maxChainCount = 1 + (player.chainLevel - 1);
    let dmgMult = 0.50 + (player.chainLevel - 1) * 0.03;
    let baseDamage = player.attackPower * dmgMult;

    let current = startEnemy;
    let hitList = [startEnemy];

    for (let c = 0; c < maxChainCount; c++) {
        let targets = enemies.filter(e =>
            !hitList.includes(e) &&
            Math.hypot(
                current.x - e.x,
                current.y - e.y
            ) < 160
        );

        if (targets.length > 0) {
            let nextTarget = targets[0];

            // 번개가 맞을 때마다 치명타를 판정합니다
            const r = applyCrit(baseDamage);

            nextTarget.hp -= r.damage;

            createDamageText(
                nextTarget.x,
                nextTarget.y,
                Math.round(r.damage),
                r.crit ? CRIT_TEXT_COLOR : '#ffe600'
            );

            createParticles(
                nextTarget.x,
                nextTarget.y,
                '#ffe600',
                4
            );

            visualEffects.push({
                type: 'lightning',
                x1: current.x,
                y1: current.y,
                x2: nextTarget.x,
                y2: nextTarget.y,
                life: 0.2,
                maxLife: 0.2
            });

            hitList.push(nextTarget);
            current = nextTarget;
        } else {
            break;
        }
    }
}
// 💥 팡~ 터지는 역동적인 폭발 모션 이펙트 생성 함수
function createExplosion(x, y, maxRadius, damage, knockback = 0) {
    createParticles(x, y, '#ff5500', 22);

    visualEffects.push({
        type: 'boom',
        x: x, y: y,
        currentRadius: 10,
        maxRadius: maxRadius,
        life: 0.4, 
        maxLife: 0.4
    });

    enemies.forEach(e => {
        let radiusEnemy = e.isBoss ? 28 : e.tier.radius;
        if (Math.hypot(x - e.x, y - e.y) < maxRadius + radiusEnemy) {
            // 폭발에 맞은 적마다 치명타를 판정합니다
            const r = applyCrit(damage);
            e.hp -= r.damage;
            createDamageText(e.x, e.y, Math.round(r.damage), r.crit ? CRIT_TEXT_COLOR : '#ff5500');

            // 넉백: 폭발 중심에서 바깥쪽으로 밀어냄 (보스는 덜 밀림)
            if (knockback > 0) {
                const d = Math.hypot(e.x - x, e.y - y) || 1;
                const push = knockback * (e.isBoss ? BOSS_KNOCKBACK_RATIO : 1);
                e.x += (e.x - x) / d * push;
                e.y += (e.y - y) / d * push;
            }
        }
    });
}

function updateVisualEffects(dt) {
    for (let i = visualEffects.length - 1; i >= 0; i--) {
        let fx = visualEffects[i];
        fx.life -= dt;

        // 💥 폭발 모션: 크기가 팡~ 하고 빠르게 커지는 연출
        if (fx.type === 'boom') {
            let progress = 1 - (fx.life / fx.maxLife); 
            fx.currentRadius = 10 + (fx.maxRadius - 10) * Math.sin(progress * Math.PI * 0.5); 
        }

        if (fx.life <= 0) visualEffects.splice(i, 1);
    }
}

function renderVisualEffects() {
    visualEffects.forEach(fx => {
        if (fx.type === 'lightning') {
            ctx.save();
            ctx.strokeStyle = 'rgba(255, 230, 0, 0.5)';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(fx.x1, fx.y1);
            ctx.lineTo(fx.x2, fx.y2);
            ctx.stroke();
            ctx.restore();
        } else if (fx.type === 'slash') {
            // 절단 자국: 광선 방향으로 짧은 흰 선이 번쩍이고 사라짐
            ctx.save();
            ctx.globalAlpha = Math.max(0, fx.life / fx.maxLife);
            ctx.strokeStyle = '#e6fbff';
            ctx.lineWidth = 3;
            const c = Math.cos(fx.angle), s = Math.sin(fx.angle);
            ctx.beginPath();
            ctx.moveTo(fx.x - c * 22, fx.y - s * 22);
            ctx.lineTo(fx.x + c * 22, fx.y + s * 22);
            ctx.stroke();
            ctx.restore();
        } else if (fx.type === 'boom') {
            // 💥 팡~ 터지는 애니메이션 렌더링 (외곽 충격파 링 + 내부 퍼지는 불꽃 + 파편)
            ctx.save();
            let alpha = fx.life / fx.maxLife; 

            // 1. 바깥쪽 퍼져나가는 충격파 링
            ctx.strokeStyle = `rgba(255, 170, 0, ${alpha * 0.8})`;
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(fx.x, fx.y, fx.currentRadius, 0, Math.PI * 2);
            ctx.stroke();

            // 2. 안쪽을 채우는 반투명 폭발광
            ctx.fillStyle = `rgba(255, 85, 0, ${alpha * 0.45})`;
            ctx.beginPath();
            ctx.arc(fx.x, fx.y, fx.currentRadius * 0.85, 0, Math.PI * 2);
            ctx.fill();

            // 3. 가장자리에 몽글몽글 터지는 불꽃 파편들
            let particleCount = 8;
            for (let i = 0; i < particleCount; i++) {
                let angle = (Math.PI * 2 / particleCount) * i + (1 - alpha);
                let pDist = fx.currentRadius * 0.9;
                let px = fx.x + Math.cos(angle) * pDist;
                let py = fx.y + Math.sin(angle) * pDist;

                ctx.fillStyle = `rgba(255, 220, 100, ${alpha})`;
                ctx.beginPath();
                ctx.arc(px, py, 6 * alpha, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        }
    });
}

function updateEnemies(dt) {
    for (let i = enemies.length - 1; i >= 0; i--) {
        let e = enemies[i];
        let radius = e.isBoss ? 28 : e.tier.radius;
        let dist = Math.hypot(player.x - e.x, player.y - e.y);
        const tgt = (turret && !e.isBoss) ? turret : player;   // 포탑이 있으면 일반 몬스터는 포탑으로 몰려감
        let angle = Math.atan2(tgt.y - e.y, tgt.x - e.x);

        if (!isFrozen(e)) {               // 동결 상태면 이동하지 않음
            e.x += Math.cos(angle) * e.speed;
            e.y += Math.sin(angle) * e.speed;
        }

        if (e.isBoss && e.stats.bullets > 0 && dist < 450) {
            e.shootTimer += dt;
            const enraged = e.hp < e.maxHp * 0.5;                       // 체력 절반 이하 → 분노
            const interval = e.stats.interval / (enraged ? 1.4 : 1);
            if (e.shootTimer >= interval) {
                e.shootTimer = 0;
                const count = e.stats.bullets;
                const offset = Math.random() * Math.PI * 2;             // 매번 다른 각도에서 발사
                for (let b = 0; b < count; b++) {
                    let bAngle = ((Math.PI * 2) / count) * b + offset;
                    enemyProjectiles.push({
                        x: e.x, y: e.y,
                        vx: Math.cos(bAngle) * e.stats.bulletSpeed, vy: Math.sin(bAngle) * e.stats.bulletSpeed,
                        radius: 5,
                        dmg: e.stats.bulletDmg
                    });
                }
            }
        }

        if (dist < player.radius + radius) {
            if (player.invincibleTimer <= 0) {
                hurtPlayer(e.isBoss ? e.stats.contact : 12);
            }
        }

        if (dist > 800 && !e.isBoss) {
            let newAngle = Math.random() * Math.PI * 2;
            e.x = player.x + Math.cos(newAngle) * 550;
            e.y = player.y + Math.sin(newAngle) * 550;
        }

        if (e.hp <= 0) {
            killCount++;
            let color = e.isBoss ? '#ffffff' : e.tier.color;
            createParticles(e.x, e.y, color, 12);

            if (!e.isBoss && e.tier.isSplitter) {
                let orangeTier = RAINBOW_TIERS[1];
                for (let s = 0; s < 2; s++) {
                    enemies.push({
                        x: e.x + (s === 0 ? 12 : -12), y: e.y, tier: orangeTier,
                        hp: orangeTier.hp, maxHp: orangeTier.hp,
                        speed: BASE_BOSS_SPEED * orangeTier.speedMult
                    });
                }
            }

            if ((player.lifeLevel || 0) > 0 && Math.random() < 0.05 * player.lifeLevel) {
                player.hp = Math.min(player.maxHp, player.hp + player.lifeLevel);   // 체력 1 × 레벨
            }
            if (player.passive === 'doctor' && Math.random() < 0.01) {
                player.hp = Math.min(player.maxHp, player.hp + 3);   // 의사: 응급처치
            }

            if (e.isBoss) {
                bossKills++;
                if (e.cityBoss) onCityBossKilled(e);
                else handleBossRewards(e.bossLevel);
                if (e.bossLevel === 60 && !clearSnapshot) recordClear();
            } else if (e.tier.exp > 0) {
                expGems.push({ x: e.x, y: e.y, val: e.tier.exp });
            }

            enemies.splice(i, 1);
        }
    }
}

function handleBossRewards(level) {
    if (level === 10) {
        player.hp = Math.min(player.maxHp, player.hp + 20);
        addExp(player.maxExp * 0.10);
        showAnnouncement("🎉 보스 처치! HP 20 회복 & EXP 10% 획득!");
    } else if (level === 20) {
        player.hp = Math.min(player.maxHp, player.hp + 20);
        addExp(player.maxExp * 0.15);
        showAnnouncement("🎉 보스 처치! HP 20 회복 & EXP 15% 획득!");
    } else if (level === 30) {
        player.hp = Math.min(player.maxHp, player.hp + 25);
        showAnnouncement("🎉 보스 처치! HP 25 회복 & 무료 스킬 선택!");
        triggerLevelUp();
    } else if (level === 40) {
        boss40Killed = true;      // 이 뒤로 Lv.50 이상이 되면 backg_6 으로 바뀜
        checkLateStage();
        player.hp = Math.min(player.maxHp, player.hp + 30);
        showAnnouncement("🎉 보스 처치! HP 30 회복 & 무료 스킬 선택!");
        triggerLevelUp();
    } else if (level === 60) {
        setBackgroundStage(6);    // 60레벨 보스 처치 → 마지막 배경(backg_7)
        player.hp = Math.min(player.maxHp, player.hp + 30);
        player.level++;
        showAnnouncement("🎉 덕분에 우리 세계에 평화가 찾아왔어요! (우측 하단 버튼으로 종료)", 4000);
    }
}

function updateEnemyProjectiles(dt) {
    for (let i = enemyProjectiles.length - 1; i >= 0; i--) {
        let ep = enemyProjectiles[i];
        ep.x += ep.vx; ep.y += ep.vy;

        if (Math.hypot(player.x - ep.x, player.y - ep.y) < player.radius + ep.radius) {
            if (player.invincibleTimer <= 0) {
                hurtPlayer(ep.dmg || 12);
            }
            enemyProjectiles.splice(i, 1);
            continue;
        }
        if (Math.hypot(player.x - ep.x, player.y - ep.y) > 750) enemyProjectiles.splice(i, 1);
    }
}

function updateItemsAndGems(dt) {
    for (let i = expGems.length - 1; i >= 0; i--) {
        let g = expGems[i];
        let dist = Math.hypot(player.x - g.x, player.y - g.y);

        if (dist < player.magnetRange) {
            g.x += (player.x - g.x) * 0.12;
            g.y += (player.y - g.y) * 0.12;
        }

        if (dist < player.radius + 8) {
            SFX.play('exp');
            addExp(g.val);
            expGems.splice(i, 1);
        }
    }

    for (let i = items.length - 1; i >= 0; i--) {
        let it = items[i];
        let dist = Math.hypot(player.x - it.x, player.y - it.y);

        if (dist < player.radius + 14) {
            if (it.type === 'heart') {
                player.hp = Math.min(player.maxHp, player.hp + 30);
                showAnnouncement("💚 하트 획득! HP 30 회복");
            } else if (it.type === 'magnet') {
                expGems.forEach(g => { g.x = player.x; g.y = player.y; });
                showAnnouncement("🧲 필드 전체 자석 작동! 모든 경험치 수집");
            } else if (it.type === 'shield') {
                player.invincibleTimer = 3.0;
                showAnnouncement("🛡️ 3초간 무적 보호막 발동!");
            }
            SFX.play('item');
            items.splice(i, 1);
        }
    }
}

function addExp(val) {
    player.exp += val * player.expMult;
    if (player.exp >= player.maxExp) {
        player.exp -= player.maxExp;
        player.level++;
        player.maxExp = Math.floor(player.maxExp * 1.20);
        triggerLevelUp();
    }
}

// 공정한 섞기 (Fisher-Yates). 예전 sort(() => 0.5 - Math.random()) 방식은 카드마다 나올 확률이 달라지는 문제가 있었음
function shuffleArray(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

function triggerLevelUp() {
    gameState = 'LEVELUP';
    let wrapper = document.getElementById('cards-wrapper');
    wrapper.innerHTML = '';

    // 최대 레벨에 도달한 스킬은 선택지에서 제외
    let shuffled = shuffleArray(SKILLS.filter(isSkillAvailable)).slice(0, player.cardChoices);
    shuffled.forEach(skill => {
        let card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
            <div class="card-icon">${skill.icon}</div>
            <div class="card-title">${skill.title}</div>
            <div class="card-desc">${skill.desc}</div>
        `;
        card.onclick = () => selectSkill(skill.id);
        wrapper.appendChild(card);
    });

    document.getElementById('levelup-modal').classList.remove('hidden');
}

function selectSkill(id) {
    SFX.play('select');
    if (id === 'laser') player.laserLevel = Math.min(10, player.laserLevel + 1);
    if (id === 'bomb') player.bombLevel = Math.min(13, player.bombLevel + 1);
    if (id === 'chain') player.chainLevel = Math.min(13, player.chainLevel + 1);
    if (id === 'tornado') player.tornadoLevel++;
    if (id === 'magnet') player.magnetRange += 50;
    if (id === 'bullet') player.bulletCount++;
    if (id === 'pierce') player.pierceCount++;
    if (id === 'speed') player.attackSpeedRatio *= 1.1;
    if (id === 'power') player.attackPower *= 1.1;
    if (id === 'movespeed') player.speed *= 1.05;
    if (id === 'crit') player.critChance = Math.min(1, player.critChance + 0.05);
    if (id === 'critdmg') player.critDamage += 10;
    if (id === 'helper') {
        if (player.helperLevel === 0) player.helperTimer = helperInterval(1) - HELPER_FIRST_DELAY;   // 처음 얻으면 곧바로 첫 등장
        player.helperLevel = Math.min(5, player.helperLevel + 1);
    }
    if (id === 'poison') {
        if (player.poisonLevel === 0) player.poisonTimer = POISON_BASE_INTERVAL - POISON_FIRST_DELAY;   // 처음 얻으면 곧바로 첫 설치
        player.poisonLevel = Math.min(POISON_MAX_LEVEL, player.poisonLevel + 1);
    }
    if (id === 'turret') player.turretLevel = Math.min(5, player.turretLevel + 1);
    if (id === 'boomerang') player.boomerangLevel = Math.min(5, player.boomerangLevel + 1);
    if (id === 'freeze') {
        if (player.freezeLevel === 0) player.freezeTimer = freezeCooldown(1) - 2;   // 처음 얻으면 2초 뒤 첫 파동
        player.freezeLevel = Math.min(FREEZE_MAX_LEVEL, player.freezeLevel + 1);
    }
    if (id === 'flatpower') { player.flatpowerLevel++; player.attackPower += 5; }

    checkEvolution();
    document.getElementById('levelup-modal').classList.add('hidden');
    player.invincibleTimer = 2.0;
    gameState = 'PLAYING';
}

    }

});

        let count = player.tornadoLevel;
        let dist = tornadoOrbitDist();
        const tornadoReady = tornadoImg.complete && tornadoImg.naturalWidth > 0;

        // 이미지 원본 비율을 유지하며 TORNADO_SPRITE_BOX 안에 맞춤
        let tw = TORNADO_SPRITE_BOX, th = TORNADO_SPRITE_BOX;
        if (tornadoReady) {
            const ratio = tornadoImg.naturalWidth / tornadoImg.naturalHeight;
            if (ratio >= 1) { tw = TORNADO_SPRITE_BOX; th = TORNADO_SPRITE_BOX / ratio; }

        for (let i = 0; i < count; i++) {
            let angle = player.tornadoAngle + (Math.PI * 2 / count) * i;
            let tx = player.x + Math.cos(angle) * dist;
            let ty = player.y + Math.sin(angle) * dist;

            if (tornadoReady) {
                ctx.save();
                ctx.imageSmoothingEnabled = SPRITE_SMOOTHING;
                if (SPRITE_SMOOTHING) ctx.imageSmoothingQuality = 'high';
                ctx.translate(tx, ty);
                ctx.rotate(gameTime * TORNADO_SPIN_SPEED + i);
                ctx.drawImage(tornadoImg, -tw / 2, -th / 2, tw, th);
                ctx.restore();
            } else {
                ctx.fillStyle = 'rgba(0, 255, 204, 0.8)';
                ctx.beginPath();
                ctx.arc(tx, ty, 10, 0, Math.PI * 2);
                ctx.fill();
            }
        }
    }

    activeLasers.forEach(l => {
    // 현재 카메라 기준으로 화면 끝점을 다시 계산
    const end = getLaserScreenEnd(l.x, l.y, l.angle);
    l.length = end.distance;
    l.endX = end.x;
    l.endY = end.y;

    ctx.save();
    ctx.translate(l.x, l.y);
    ctx.rotate(l.angle);

    // 1. 바깥쪽 에너지 빛
    ctx.globalAlpha = 0.0;
    ctx.fillStyle = '#00ccff';
    ctx.fillRect(0, -l.width, l.length, l.width * 0.01);

    // 2. PNG 광선
    ctx.globalAlpha = 0.55;

    if (laserBeamImg.complete && laserBeamImg.naturalWidth > 0) {
        ctx.drawImage(
            laserBeamImg,
            0, -l.width * 1.5,
            l.length, l.width * 3
        );
    } else {
        ctx.fillStyle = '#bafaff';
        ctx.fillRect(0, -l.width / 4, l.length, l.width / 2);
    }

    // 3. 중심의 흰색 광선
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, -2, l.length, 4);

    ctx.restore();
});

    drawPlasma();
    laserEdgeEffects.forEach(hit => {
    if (!laserHitImg.complete || laserHitImg.naturalWidth === 0) {
        return;
    }

    const progress = Math.max(0, hit.duration / hit.maxDuration);
    const size = 64 * (1.3 - progress * 0.3);

    ctx.save();
    ctx.globalAlpha = progress;

    ctx.drawImage(
        laserHitImg,
        hit.x - size / 2,
        hit.y - size / 2,
        size,
        size
    );

    ctx.restore();
});

    projectiles.forEach(drawProjectile);

    enemyProjectiles.forEach(ep => {
        ctx.fillStyle = '#ff0055';
        ctx.beginPath();
        ctx.arc(ep.x, ep.y, ep.radius, 0, Math.PI * 2);
        ctx.fill();
    });

    enemies.forEach(e => {
        // 표시 크기만 PNG 크기로 변경합니다. 충돌/공격 판정 반경은 기존 값 그대로입니다.
        const radius = e.isBoss ? 28 : e.tier.radius;
        const spriteKey = e.spriteKey || (e.isBoss ? `Boss${e.bossLevel}` : e.tier.name);
        const img = ENEMY_IMAGES[spriteKey];
        const spriteSize = e.isBoss ? BOSS_SPRITE_SIZE : ENEMY_SPRITE_SIZE;
        const imageReady = img && img.loaded && !img.failed && img.naturalWidth > 0;

        if (imageReady && !e.isBoss && OUTLINE_MONSTERS.includes(spriteKey)) {
            const o = getOutlinedSprite(spriteKey, img);
            const T = spriteSize + OUTLINE_WIDTH * 2;
            ctx.drawImage(o, e.x - T / 2, e.y - T / 2, T, T);
        } else if (imageReady) {
            ctx.drawImage(img, e.x - spriteSize / 2, e.y - spriteSize / 2, spriteSize, spriteSize);
        } else {
            // PNG가 없거나 아직 로딩 중이거나 로딩에 실패하면 기존 원형으로 표시합니다.
            ctx.fillStyle = e.isBoss ? '#ffffff' : e.tier.color;
            ctx.beginPath();
            ctx.arc(e.x, e.y, radius, 0, Math.PI * 2);
            ctx.fill();
        }

        if (e.isBoss) {
            const barTop = e.y - (imageReady ? BOSS_SPRITE_SIZE / 2 : radius) - 14;
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(e.x - 26, barTop, 52, 6);
            ctx.fillStyle = '#ff0055';
            ctx.fillRect(e.x - 26, barTop, Math.max(0, (e.hp / e.maxHp) * 52), 6);
        }
    });

    // 🧙‍♂️ 캐릭터 렌더링 (이미지 원본 비율 유지)
    ctx.save();
    if (playerImg.complete && playerImg.naturalWidth !== 0) {
        drawPlayerSprite();
    } else {
        ctx.fillStyle = '#00ffcc';
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
        ctx.fill();
    }

    if (player.invincibleTimer > 0) {
        ctx.strokeStyle = 'rgba(255, 0, 85, 0.85)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.radius + 6, 0, Math.PI * 2);
        ctx.stroke();
    }
    ctx.restore();

    drawHelper();          // 👼 아군 천사
    drawPoisons();         // ☠️ 독 구름
    drawFreezeEffects();   // ❄️ 빙결 파동 / 얼음 상태
    drawTurretAndBoomerangs();   // 🗼 포탑 / 🪃 부메랑 (월드 좌표)
    drawPet();            // 🐾 펫 (월드 좌표, 플레이어 오른쪽 대각선 아래)
    renderVisualEffects(); // 💥 폭발 애니메이션 및 연쇄전격 렌더링
    renderParticles();
    renderFloatingTexts();

    ctx.restore();

    drawItemArrows();     // 화면 밖 아이템 화살표 (화면 좌표)
    drawRoulette();       // 🎰 가챠 룰렛 (화면 좌표)
    renderHUD();
}

// 캐릭터 공격 그리기: PNG가 있으면 이미지로, 없으면 기존 동그라미로 표시
function drawProjectile(p) {
    const img = playerBulletImg;
    if (img && img.complete && img.naturalWidth > 0) {
        const box = PROJECTILE_SPRITE_BOX * (p.crit ? PROJECTILE_CRIT_SCALE : 1);
        const ratio = img.naturalWidth / img.naturalHeight;
        let w, h;
        if (ratio >= 1) { w = box; h = box / ratio; }
        else            { h = box; w = box * ratio; }

        ctx.save();
        ctx.translate(p.x, p.y);
        if (PROJECTILE_ROTATE) ctx.rotate(Math.atan2(p.vy, p.vx));
        ctx.imageSmoothingEnabled = SPRITE_SMOOTHING;
        if (SPRITE_SMOOTHING) ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, -w / 2, -h / 2, w, h);
        ctx.restore();
    } else {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
    }
}

// 흰색 테두리가 씌워진 몬스터 이미지 (처음 한 번만 만들고 재사용)
const outlineCache = {};
function getOutlinedSprite(key, img) {
    if (outlineCache[key]) return outlineCache[key];
    const S = ENEMY_SPRITE_SIZE, p = OUTLINE_WIDTH, T = S + p * 2;
    // 1) 몬스터 모양을 흰색 실루엣으로 바꿈
    const sil = document.createElement('canvas');
    sil.width = S; sil.height = S;
    const sc = sil.getContext('2d');
    sc.drawImage(img, 0, 0, S, S);
    sc.globalCompositeOperation = 'source-in';
    sc.fillStyle = '#ffffff';
    sc.fillRect(0, 0, S, S);
    // 2) 실루엣을 사방 16방향으로 조금씩 밀어서 그려 테두리를 만듦
    const out = document.createElement('canvas');
    out.width = T; out.height = T;
    const oc = out.getContext('2d');
    for (let i = 0; i < 16; i++) {
        const a = (i / 16) * Math.PI * 2;
        oc.drawImage(sil, p + Math.cos(a) * p, p + Math.sin(a) * p, S, S);
    }
    // 3) 원래 몬스터 이미지를 가운데에 덮어 그림
    oc.drawImage(img, p, p, S, S);
    outlineCache[key] = out;
    return out;
}

// 화면 밖 아이템 화살표: 가까운 순서로 최대 ARROW_MAX개. 반환값은 화면 좌표
function getItemArrows() {
    const W = canvas.width, H = canvas.height, pad = 34;
    const cx = W / 2, cy = H / 2;
    const off = items
        .map(it => ({ it, d: Math.hypot(it.x - player.x, it.y - player.y) }))
        .filter(o => {
            const sx = o.it.x - camera.x, sy = o.it.y - camera.y;
            return sx < 0 || sx > W || sy < 0 || sy > H;     // 화면 밖에 있는 것만
        })
        .sort((a, b) => a.d - b.d)
        .slice(0, ARROW_MAX);

    return off.map(({ it }) => {
        const sx = it.x - camera.x, sy = it.y - camera.y;
        const ang = Math.atan2(sy - cy, sx - cx);
        const dx = Math.cos(ang), dy = Math.sin(ang);
        // 화면 가장자리 안쪽(pad)과 만나는 지점 계산
        const tx = dx !== 0 ? ((dx > 0 ? W - pad : pad) - cx) / dx : Infinity;
        const ty = dy !== 0 ? ((dy > 0 ? H - pad : pad) - cy) / dy : Infinity;
        const t = Math.min(tx, ty);
        return { ax: cx + dx * t, ay: cy + dy * t, ang, type: it.type };
    });
}

function drawItemArrows() {
    const arrows = getItemArrows();
    if (arrows.length === 0) return;
    const colors = { heart: '#2ecc71', magnet: '#ffd84a', shield: '#00ccff' };
    const icons = { heart: '💚', magnet: '🧲', shield: '🛡️' };
    ctx.save();
    for (const a of arrows) {
        const color = colors[a.type] || '#fff';
        ctx.save();
        ctx.translate(a.ax, a.ay);
        ctx.rotate(a.ang);
        ctx.fillStyle = color;
        ctx.strokeStyle = 'rgba(0,0,0,0.7)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(12, 0); ctx.lineTo(-7, -9); ctx.lineTo(-7, 9); ctx.closePath();
        ctx.fill(); ctx.stroke();
        ctx.restore();
        // 아이콘은 화살표 안쪽에 표시
        ctx.font = `${Math.round(16 * UI_SCALE)}px Arial`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(icons[a.type] || '❔', a.ax - Math.cos(a.ang) * 26, a.ay - Math.sin(a.ang) * 26);
    }
    ctx.restore();
}

function drawPlayerSprite() {
    // 이미지의 가로/세로 비율을 계산해서, PLAYER_SPRITE_BOX 안에 찌그러짐 없이 맞춥니다.
    const ratio = playerImg.naturalWidth / playerImg.naturalHeight;
    let w, h;
    if (ratio >= 1) { w = PLAYER_SPRITE_BOX; h = PLAYER_SPRITE_BOX / ratio; }
    else            { h = PLAYER_SPRITE_BOX; w = PLAYER_SPRITE_BOX * ratio; }

    ctx.save();
    ctx.imageSmoothingEnabled = SPRITE_SMOOTHING;
    if (SPRITE_SMOOTHING) ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(playerImg, player.x - w / 2, player.y - h / 2, w, h);
    ctx.restore();
}

function setBackgroundStage(stage) {
    if (stage === bgStage || stage < 0 || stage >= activeBgImages().length) return;
    bgPrevStage = bgStage;
    bgStage = stage;
    bgFade = 0;
}

function bgReady(i) {
    const im = activeBgImages()[i];
    return !!im && im.complete && im.naturalWidth > 0;
}

// 월드 좌표에 타일을 깔아서 어디로 가도 배경이 끊기지 않고 계속 이어지게 그립니다.
function drawBgLayer(img) {
    const S = BG_TILE_SIZE;
    const tx0 = Math.floor(camera.x / S), tx1 = Math.floor((camera.x + canvas.width) / S);
    const ty0 = Math.floor(camera.y / S), ty1 = Math.floor((camera.y + canvas.height) / S);

    for (let ty = ty0; ty <= ty1; ty++) {
        for (let tx = tx0; tx <= tx1; tx++) {
            const flipX = BG_MIRROR_TILES && (((tx % 2) + 2) % 2 === 1);
            const flipY = BG_MIRROR_TILES && (((ty % 2) + 2) % 2 === 1);
            ctx.save();
            ctx.translate(tx * S + (flipX ? S : 0), ty * S + (flipY ? S : 0));
            ctx.scale(flipX ? -1 : 1, flipY ? -1 : 1);
            ctx.drawImage(img, 0, 0, S + 1, S + 1);   // +1px: 타일 사이 실선 방지
            ctx.restore();
        }
    }
}

function drawBackground() {
    if (!bgReady(bgStage)) { drawGrid(); return; }   // 이미지가 없으면 기존 격자 배경

    ctx.save();
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';

    if (bgFade < 1 && bgReady(bgPrevStage)) {
        drawBgLayer(activeBgImages()[bgPrevStage]);
        ctx.globalAlpha = bgFade;
    }
    drawBgLayer(activeBgImages()[bgStage]);
    ctx.globalAlpha = 1;

    if (BG_DIM > 0) {
        ctx.fillStyle = `rgba(0, 0, 0, ${BG_DIM})`;
        ctx.fillRect(camera.x, camera.y, canvas.width, canvas.height);
    }
    ctx.restore();
}

function drawGrid() {
    let size = 60;
    let startX = Math.floor(camera.x / size) * size;
    let startY = Math.floor(camera.y / size) * size;

    ctx.strokeStyle = '#18182e';
    ctx.lineWidth = 1;

    for (let x = startX; x < startX + canvas.width + size; x += size) {
        ctx.beginPath(); ctx.moveTo(x, camera.y); ctx.lineTo(x, camera.y + canvas.height); ctx.stroke();
    }
    for (let y = startY; y < startY + canvas.height + size; y += size) {
        ctx.beginPath(); ctx.moveTo(camera.x, y); ctx.lineTo(camera.x + canvas.width, y); ctx.stroke();
    }
}

function renderHUD() {
    ctx.fillStyle = '#222';
    ctx.fillRect(20, 20, 200, 16);
    ctx.fillStyle = player.invincibleTimer > 0 ? '#ff0055' : '#2ecc71';
    ctx.fillRect(20, 20, Math.max(0, (player.hp / player.maxHp) * 200), 16);
    ctx.strokeStyle = '#fff';
    ctx.strokeRect(20, 20, 200, 16);

    ctx.fillStyle = '#fff';
    ctx.font = '12px Arial';
    ctx.fillText(`HP: ${Math.ceil(player.hp)} / ${player.maxHp}`, 25, 33);

    ctx.fillStyle = '#222';
    ctx.fillRect(20, 42, 200, 8);
    ctx.fillStyle = '#3498db';
    ctx.fillRect(20, 42, (player.exp / player.maxExp) * 200, 8);

    ctx.font = '14px Arial';
    ctx.fillText(`Lv. ${player.level}`, 230, 33);
    ctx.fillText(`⏱️ ${Math.floor(gameTime)}초`, 230, 50);
    ctx.fillText(`💀 처치: ${killCount}`, 320, 33);

    if (showStats) renderStatsPanel();
    renderTouchUI();
}

// 우측 상단 능력치 패널 (작은 흰 글씨). 📊 버튼 또는 H 키로 켜고 끕니다.

try { showStats = localStorage.getItem('pixelSurvivors_showStats') !== '0'; } catch (e) {}

function renderStatsPanel() {

    ];

    const maxTag = (lv, max) => (lv >= max ? ' MAX' : '');
    const skillLines = [];
    if (player.laserLevel > 0)   skillLines.push(`⚡ 레이저 Lv.${player.laserLevel}${maxTag(player.laserLevel, 10)}`);
    if (player.bombLevel > 0)    skillLines.push(`💣 폭탄 Lv.${player.bombLevel}${maxTag(player.bombLevel, 10)}`);
    if (player.chainLevel > 0)   skillLines.push(`🌩️ 연쇄 전격 Lv.${player.chainLevel}${maxTag(player.chainLevel, 13)}`);
    if (player.tornadoLevel > 0) skillLines.push(`🌪️ 회오리 Lv.${player.tornadoLevel}${maxTag(player.tornadoLevel, 10)}`);
    if (player.helperLevel > 0)  skillLines.push(`👼 도와줘! Lv.${player.helperLevel}${maxTag(player.helperLevel, 5)}`);
    if (player.poisonLevel > 0)  skillLines.push(`☠️ 독 Lv.${player.poisonLevel}${maxTag(player.poisonLevel, 7)}`);
    if (player.freezeLevel > 0)  skillLines.push(`❄️ 빙결 Lv.${player.freezeLevel}${maxTag(player.freezeLevel, 7)}`);
    if (player.turretLevel > 0)  skillLines.push(`🗼 포탑 Lv.${player.turretLevel}${maxTag(player.turretLevel, 5)}`);
    if (player.boomerangLevel > 0) skillLines.push(`🪃 부메랑 Lv.${player.boomerangLevel}${maxTag(player.boomerangLevel, 5)}`);
    if (skillLines.length) { lines.push('— 스킬 —'); lines.push(...skillLines); }

    ctx.save();
    ctx.font = `${Math.round(12 * UI_SCALE)}px Arial`;
    ctx.textAlign = 'right';
    ctx.fillStyle = '#fff';
    lines.forEach((t, i) => ctx.fillText(t, canvas.width - 14, 56 + i * Math.round(16 * UI_SCALE)));
    ctx.restore();
}

function getNearestEnemies(count, x = player.x, y = player.y) {
    return [...enemies]
        .sort((a, b) => Math.hypot(x - a.x, y - a.y) - Math.hypot(x - b.x, y - b.y))
        .slice(0, count);
}

function createDamageText(x, y, text, color = '#fff') {
    floatingTexts.push({ x, y, text, color, alpha: 1.0, vy: -1 });
}

function renderFloatingTexts() {
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
        let t = floatingTexts[i];
        t.y += t.vy;
        t.alpha -= 0.02;
        ctx.fillStyle = t.color;
        ctx.globalAlpha = Math.max(0, t.alpha);
        ctx.font = 'bold 14px Arial';
        ctx.fillText(t.text, t.x - 10, t.y);
        ctx.globalAlpha = 1.0;
        if (t.alpha <= 0) floatingTexts.splice(i, 1);
    }
}

function createSpark(x, y, color) {
    createParticles(x, y, color, 4);
}

function createParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        let angle = Math.random() * Math.PI * 2;
        let speed = 1 + Math.random() * 3;
        particles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, color, life: 0.3 });
    }
}

function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx; p.y += p.vy;
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function renderParticles() {
    particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 3, 3);
    });
}

function distToSegment(p, v, w) {
    let l2 = (v.x - w.x)**2 + (v.y - w.y)**2;
    if (l2 === 0) return Math.hypot(p.x - v.x, p.y - v.y);
    let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(p.x - (v.x + t * (w.x - v.x)), p.y - (v.y + t * (w.y - v.y)));
}

const BOOMER_INTERVAL = 2.5;        // 발사 주기(초, 공격속도에 따라 짧아짐)
const BOOMER_OUT_SPEED = 600;       // 나가는 속도(px/s)

function towerDuration(lv) { return 5 + 3 * (lv - 1); }                                    // 이번 판에서 장착한 펫 상태

// 펫 레벨별 효과 (레벨 1 기준, 레벨당 증가분은 아래 함수에서 조절)
function petLevelCost(lv) { return Math.round(1000 * Math.pow(1.4, lv - 1)); }   // 임시값: lv → lv+1 비용
function petPhoneCharges(lv) { return lv >= 5 ? 2 : 1; }      // 4레벨까지 1회, 5레벨부터 2회
function petPhoneBossRatio(lv) { return 0.70 + 0.03 * (lv - 1); }  // 레벨당 +3%p                 // 보스 체력 감소 비율
function petNeroMult(lv) { return 1 + 0.2 * (lv - 1); }                           // 네로 피해/공속 배율
function petDuckDuration(lv) { return 3 + 0.5 * (lv - 1); }                       // 오리 무적 시간(초)
function petBreadHeal(lv) { return 5 + 2 * (lv - 1); }                            // 붕어빵 회복량

function initPetRun() {
    petRun = null;
    const id = save.equippedPet;
    if (!id || !save.pets[id]) return;
    const lv = save.pets[id];
    petRun = {
        id, lv,
        x: 0, y: 0,
        timer: 0,              // 오리/붕어빵 주기 타이머
        fireT: 0,              // 네로 발사 타이머
        charges: id === 'phone' ? petPhoneCharges(lv) : 0,
        bossRatio: id === 'phone' ? petPhoneBossRatio(lv) : 0
    };
}

function updatePet(dt) {
    if (!petRun) return;
    // 플레이어 기준 오른쪽 대각선 아래에 고정 (도와줘 천사는 왼쪽 대각선 위)
    petRun.x = player.x + PET_FOLLOW_X;
    petRun.y = player.y + PET_FOLLOW_Y;

    if (petRun.id === 'nero') {
        // 공격속도 = 플레이어 공격속도 × 0.5 × 레벨 배율
        petRun.fireT += dt * player.attackSpeedRatio * 0.5 * petNeroMult(petRun.lv);
        if (petRun.fireT >= 1) {
            petRun.fireT = 0;
            const target = getNearestEnemies(1, petRun.x, petRun.y)[0];
            if (target) {
                const a = Math.atan2(target.y - petRun.y, target.x - petRun.x);
                projectiles.push({
                    x: petRun.x, y: petRun.y,
                    vx: Math.cos(a) * 8.5, vy: Math.sin(a) * 8.5,
                    pierce: 1,
                    damage: player.attackPower * 0.5 * petNeroMult(petRun.lv),
                    crit: false,
                    color: '#ffb3ff',
                    radius: 5
                });
            }
        }
    } else if (petRun.id === 'duck') {
        petRun.timer += dt;
        if (petRun.timer >= 60) {
            petRun.timer = 0;
            player.invincibleTimer = Math.max(player.invincibleTimer, petDuckDuration(petRun.lv));
            createParticles(petRun.x, petRun.y, '#fff7a8', 8);
        }
    } else if (petRun.id === 'bread') {
        petRun.timer += dt;
        if (petRun.timer >= 30) {
            petRun.timer = 0;
            player.hp = Math.min(player.maxHp, player.hp + petBreadHeal(petRun.lv));
            createDamageText(player.x, player.y - 20, petBreadHeal(petRun.lv), '#2ecc71');
        }
    }
}

// 스마트폰: 300초 이후 1회 작동 → 모든 일반 적 처치, 보스는 현재 체력의 일정 비율 감소
function usePetSkill() {
    if (!petRun || petRun.id !== 'phone') return;
    if (gameState !== 'PLAYING' || gameTime < PET_PHONE_UNLOCK_SEC || petRun.charges <= 0) return;
    petRun.charges--;
    for (const e of enemies) {
        if (e.isBoss) e.hp -= e.hp * petRun.bossRatio;
        else e.hp = 0;
    }
    createParticles(player.x, player.y, '#7fd8ff', 30);
    showAnnouncement('📱 스마트폰 작동! 맵의 적을 정리했어요', 2000);
    SFX.play('boss');
}

function updatePetUI() {
    const btn = document.getElementById('pet-skill-btn');
    if (!btn) return;
    const show = !!petRun && petRun.id === 'phone' && (gameState === 'PLAYING' || gameState === 'PAUSED' || gameState === 'LEVELUP');
    btn.classList.toggle('hidden', !show);
    if (!show) return;
    let label;
    if (petRun.charges <= 0) label = '📱 0';
    else if (gameTime < PET_PHONE_UNLOCK_SEC) label = `📱 ${Math.ceil(PET_PHONE_UNLOCK_SEC - gameTime)}초`;
    else label = `📱 ${petRun.charges}`;
    if (btn.textContent !== label) btn.textContent = label;
    btn.disabled = petRun.charges <= 0 || gameTime < PET_PHONE_UNLOCK_SEC;
}

function drawPet() {
    if (!petRun) return;
    const img = petImgs[petRun.id];
    const bob = Math.sin(gameTime * 4) * 2;
    if (img && img.complete && img.naturalWidth > 0) {
        const ratio = img.naturalWidth / img.naturalHeight;
        let w = PET_BOX, h = PET_BOX;
        if (ratio >= 1) h = PET_BOX / ratio; else w = PET_BOX * ratio;
        ctx.save();
        ctx.imageSmoothingEnabled = SPRITE_SMOOTHING;
        ctx.drawImage(img, petRun.x - w / 2, petRun.y - h / 2 + bob, w, h);
        ctx.restore();
    } else {
        const pet = PETS.find(p => p.id === petRun.id);
        ctx.save();
        ctx.font = '30px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(pet.icon, petRun.x, petRun.y + bob);
        ctx.restore();
    }
}

function upgradeCost(u, lv) {
    return u.costs ? u.costs[lv] : Math.round(u.base * Math.pow(u.grow, lv));
}

function loadSave() {
    const fresh = { coins: 0, upgrades: {}, bestTime: 0, bestKills: 0, bestLevel: 0, runs: 0, clearedBase: false, clearedCity: false, cityVisited: false, pets: {}, equippedPet: null, chars: {} };
    try {
        const raw = localStorage.getItem(SAVE_KEY);
        if (raw) return Object.assign(fresh, JSON.parse(raw));
    } catch (e) { console.warn('세이브 불러오기 실패', e); }
    return fresh;
}
function persistSave() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }
    catch (e) { console.warn('세이브 저장 실패(브라우저 설정 확인)', e); }
}
let save = loadSave();

function upLv(id) { return (save.upgrades[id] || 0); }

function applyMetaUpgrades() {
    player.maxHp += 8 * upLv('hp');
    player.hp = player.maxHp;
    player.attackPower *= 1 + 0.04 * upLv('power');
    player.attackSpeedRatio *= 1 + 0.03 * upLv('atkspeed');
    player.speed *= 1 + 0.02 * upLv('move');
    player.magnetRange += 10 * upLv('magnet');
    player.expMult = 1 + 0.05 * upLv('exp');
    player.damageTakenMult = 1 - 0.04 * upLv('armor');
    player.revivesLeft = upLv('revive');
    player.critChance += CRIT_SHOP_TOTAL[Math.min(upLv('crit'), CRIT_SHOP_TOTAL.length - 1)] / 100;
    // 대도시 해금 스탯
    player.critChance += 0.02 * upLv('crit2');
    player.critDamage += 2 * upLv('critdmg2');
    player.attackPower *= 1 + 0.02 * upLv('atk2');
    player.lifeLevel = upLv('lifesteal');   // 생명력 흡수 레벨 (처치 시 확률 5%×레벨, 회복 1%×레벨)
}

// ----- 60레벨 보스 처치 시 기록 고정 + 게임 종료 버튼 -----
function recordClear() {
    clearSnapshot = {
        time: Math.floor(gameTime),
        kills: killCount,
        level: player.level,      // 60레벨 보스 보상 레벨업까지 반영된 값
        bossKills: bossKills
    };
    document.getElementById('end-run-btn').classList.remove('hidden');
}

// 클리어 전이면 현재 기록, 클리어 후면 처치 직후 기록을 사용
function getRunStats() {
    return clearSnapshot || { time: Math.floor(gameTime), kills: killCount, level: player.level, bossKills: bossKills };
}

function finishRun() {
    if (gameState === 'PLAYING') endRun();
}

function calcRunReward() {
    const s = getRunStats();
    const parts = {
        time:  Math.floor(s.time / 10),          // 10초당 1코인
        kills: Math.floor(s.kills / 10),  // 10마리당 1코인
        level: s.level * 2,           // 레벨당 2코인
        boss:  s.bossKills * 30              // 보스 1마리당 30코인
    };
    const sub = parts.time + parts.kills + parts.level + parts.boss;
    const mult = (1 + 0.10 * upLv('coin')) * (currentWorld === 'city' ? 1.3 : 1) * (player.passive === 'dog' ? 1.15 : 1);
    return { parts, sub, mult, total: Math.max(1, Math.round(sub * mult)) };
}

function endRun() {
    gameState = 'GAMEOVER';
    document.getElementById('stats-toggle').classList.add('hidden');
    document.getElementById('menu-btn').classList.add('hidden');
    document.getElementById('end-run-btn').classList.add('hidden');

    const s = getRunStats();
    const cleared = !!clearSnapshot;
    const r = calcRunReward();
    const newBest = s.time > save.bestTime;
    save.coins += r.total;
    save.runs += 1;
    if (cleared && currentWorld === 'base') save.clearedBase = true;   // 황궁 던전 최종 보스 클리어 → 대도시 해금
    if (cleared && currentWorld === 'city') save.clearedCity = true;   // 대도시 클리어 기록
    save.bestTime = Math.max(save.bestTime, s.time);
    save.bestKills = Math.max(save.bestKills, s.kills);
    save.bestLevel = Math.max(save.bestLevel, s.level);
    persistSave();

    const title = document.getElementById('gameover-title');
    title.textContent = cleared ? (currentWorld === 'city' ? '🏆 CITY CLEAR' : '🎉 GAME CLEAR') : 'GAME OVER';
    title.style.color = cleared ? '#ffd84a' : '#ff3366';
    title.style.textShadow = cleared ? '0 0 16px #ffd84a' : '0 0 16px #ff3366';

    document.getElementById('final-stats').innerText =
        `생존 시간: ${s.time}초 | 처치 수: ${s.kills}마리 | 최종 레벨: ${s.level}` +
        (cleared ? '  (60레벨 보스 처치 시점 기준)' : '') + (newBest ? '  🏆 최고 기록!' : '');

    document.getElementById('reward-box').innerHTML = `
        <div>⏱️ 생존 ${s.time}초 → +${r.parts.time}</div>
        <div>💀 처치 ${s.kills}마리 → +${r.parts.kills}</div>
        <div>⭐ 레벨 ${s.level} → +${r.parts.level}</div>
        ${s.bossKills ? `<div>👑 보스 ${s.bossKills}마리 → +${r.parts.boss}</div>` : ''}
        ${currentWorld === 'city' ? `<div>🏙️ 대도시 보상 ×1.3</div>` : ''}
        ${upLv('coin') > 0 ? `<div>🍀 행운의 동전 ×${(1 + 0.10 * upLv('coin')).toFixed(1)}</div>` : ''}
        <div class="total">🪙 획득 +${r.total}  (보유 ${save.coins})</div>`;

    refreshCoinLabels();
    document.getElementById('gameover-modal').classList.remove('hidden');
}

function refreshCoinLabels() {
    document.querySelectorAll('.coin-count').forEach(el => el.textContent = save.coins);
}

let shopReturnTo = 'start';
function openShop(from) {
    shopReturnTo = from;
    trainTab = 'stats';
    document.getElementById(from === 'gameover' ? 'gameover-modal' : 'start-modal').classList.add('hidden');
    renderShop();
    document.getElementById('shop-modal').classList.remove('hidden');
}
function closeShop() {
    document.getElementById('shop-modal').classList.add('hidden');
    document.getElementById(shopReturnTo === 'gameover' ? 'gameover-modal' : 'start-modal').classList.remove('hidden');
    refreshCoinLabels();
}

// 캐릭터별 기본 능력치 계산 (현재 강화 수치 반영)
function computeCharStats(id) {
    const c = CHARACTERS[id];
    const atk = 25 * c.attackMult * (1 + 0.04 * upLv('power')) * (1 + 0.02 * upLv('atk2'));
    const asr = c.attackSpeed * (1 + 0.03 * upLv('atkspeed'));
    const spd = BASE_PLAYER_SPEED * c.moveMult * (1 + 0.02 * upLv('move'));
    const hp = 100 + (c.hpBonus || 0) + 8 * upLv('hp');
    const crit = c.crit + CRIT_SHOP_TOTAL[Math.min(upLv('crit'), CRIT_SHOP_TOTAL.length - 1)] / 100 + 0.02 * upLv('crit2');
    const critDmg = CRIT_BASE_MULT + (c.critDmgBonus || 0) / 100 + 0.02 * upLv('critdmg2');   // 치명타 배율
    return { atk, asr, spd, hp, crit, cards: c.cardChoices, shots: 1 + (c.extraBullets || 0), pierce: c.pierce, critDmg };
}

function renderInfoTab(grid) {
    grid.innerHTML = '';
    Object.entries(CHARACTERS).forEach(([id, c]) => {
        const owned = isCharOwned(id);
        const st = computeCharStats(id);
        const item = document.createElement('div');
        item.className = 'shop-item';
        item.style.alignItems = 'flex-start';
        item.innerHTML = `
            <div class="s-icon">${owned ? c.icon : '🔒'}</div>
            <div class="s-body">
                <div class="s-name">${c.name}${owned ? '' : ' (미보유)'}</div>
                <div class="s-desc">⚔️ 공격력 ${st.atk.toFixed(1)} · ⚡ 공격속도 ${st.asr.toFixed(2)}/초 · 🏃 이동속도 ${st.spd.toFixed(2)}</div>
                <div class="s-desc">❤️ 최대 체력 ${Math.round(st.hp)} · 🎯 치명타 ${Math.round(st.crit * 100)}% (피해 ${(st.critDmg * 100).toFixed(0)}%) · 🏹 투사체 ${st.shots} · 🗡️ 관통 ${st.pierce}</div>
                <div class="s-desc">🃏 레벨업 카드 ${st.cards}장 · ${c.ability}</div>
            </div>`;
        grid.appendChild(item);
    });
}

function renderCharTab(grid) {
    grid.innerHTML = '';
    Object.entries(CHARACTERS).filter(([, c]) => c.price).forEach(([id, c]) => {
        const owned = isCharOwned(id);
        const item = document.createElement('div');
        item.className = 'shop-item';
        item.innerHTML = `
            <div class="s-icon">${c.icon}</div>
            <div class="s-body">
                <div class="s-name">${c.name}</div>
                <div class="s-desc">${c.ability}</div>
                <div class="s-lv">${owned ? '보유 중' : '미보유'}</div>
            </div>`;
        const b = document.createElement('button');
        if (owned) {
            b.textContent = '보유';
            b.disabled = true;
        } else {
            b.textContent = `🪙 ${c.price}`;
            b.disabled = save.coins < c.price;
            b.onclick = () => buyCharacter(id);
        }
        item.appendChild(b);
        grid.appendChild(item);
    });
}

function buyCharacter(id) {
    const c = CHARACTERS[id];
    if (isCharOwned(id) || save.coins < c.price) return;
    save.coins -= c.price;
    save.chars[id] = true;
    persistSave();
    renderShop();
}

function renderPetTab(grid) {
    grid.innerHTML = '';
    PETS.forEach(p => {
        const owned = save.pets[p.id];           // 레벨(없으면 undefined)
        const equipped = save.equippedPet === p.id;
        const item = document.createElement('div');
        item.className = 'shop-item';
        const lvText = owned ? `Lv.${owned} / ${PET_MAX_LEVEL}${equipped ? '  · 장착 중' : ''}` : '미보유';
        item.innerHTML = `
            <div class="s-icon">${p.icon}</div>
            <div class="s-body">
                <div class="s-name">${p.name}</div>
                <div class="s-desc">${p.desc}</div>
                <div class="s-lv">${lvText}</div>
            </div>`;
        if (!owned) {
            const b = document.createElement('button');
            b.textContent = `🪙 ${p.price}`;
            b.disabled = save.coins < p.price;
            b.onclick = () => buyPet(p.id);
            item.appendChild(b);
        } else {
            const eq = document.createElement('button');
            eq.textContent = equipped ? '해제' : '장착';
            eq.onclick = () => { save.equippedPet = equipped ? null : p.id; persistSave(); renderShop(); };
            item.appendChild(eq);
            if (owned < PET_MAX_LEVEL) {
                const up = document.createElement('button');
                const cost = petLevelCost(owned);
                up.textContent = `⬆ 🪙 ${cost}`;
                up.disabled = save.coins < cost;
                up.onclick = () => levelUpPet(p.id);
                item.appendChild(up);
            } else {
                const mx = document.createElement('button');
                mx.textContent = 'MAX';
                mx.disabled = true;
                item.appendChild(mx);
            }
        }
        grid.appendChild(item);
    });
}

function buyPet(id) {
    const p = PETS.find(x => x.id === id);
    if (save.pets[id] || save.coins < p.price) return;
    save.coins -= p.price;
    save.pets[id] = 1;
    if (!save.equippedPet) save.equippedPet = id;    // 처음 산 펫은 자동 장착
    persistSave();
    renderShop();
}

function levelUpPet(id) {
    const lv = save.pets[id];
    if (!lv || lv >= PET_MAX_LEVEL) return;
    const cost = petLevelCost(lv);
    if (save.coins < cost) return;
    save.coins -= cost;
    save.pets[id] = lv + 1;
    persistSave();
    renderShop();
}

function setTrainTab(tab) {
    trainTab = tab;
    renderShop();
}

function renderShop() {
    const grid = document.getElementById('shop-grid');
    const note = document.getElementById('train-note');
    grid.innerHTML = '';
    ['stats', 'char', 'pet', 'info'].forEach(t => {
        document.getElementById('tab-' + t).style.opacity = (t === trainTab) ? '1' : '0.55';
    });
    if (trainTab === 'info') {
        grid.classList.remove('hidden');
        note.classList.add('hidden');
        renderInfoTab(grid);
        refreshCoinLabels();
        return;
    }
    if (trainTab === 'pet') {
        grid.classList.remove('hidden');
        note.classList.add('hidden');
        renderPetTab(grid);
        refreshCoinLabels();
        return;
    }
    if (trainTab === 'char') {
        grid.classList.remove('hidden');
        note.classList.add('hidden');
        renderCharTab(grid);
        refreshCoinLabels();
        return;
    }
    if (trainTab !== 'stats') {
        grid.classList.add('hidden');
        note.classList.remove('hidden');
        note.textContent = '';
        refreshCoinLabels();
        return;
    }
    grid.classList.remove('hidden');
    note.classList.add('hidden');
    UPGRADES.forEach(u => {
        if (u.city && !save.cityVisited) {
            const locked = document.createElement('div');
            locked.className = 'shop-item';
            locked.innerHTML = `
                <div class="s-icon">🔒</div>
                <div class="s-body">
                    <div class="s-name">${u.name}</div>
                    <div class="s-desc">대도시 맵을 열면 해금됩니다</div>
                </div>`;
            const b = document.createElement('button');
            b.textContent = '🔒';
            b.disabled = true;
            locked.appendChild(b);
            grid.appendChild(locked);
            return;
        }
        const lv = upLv(u.id);
        const maxed = lv >= u.max;
        const cost = maxed ? 0 : upgradeCost(u, lv);
        const item = document.createElement('div');
        item.className = 'shop-item';
        item.innerHTML = `
            <div class="s-icon">${u.icon}</div>
            <div class="s-body">
                <div class="s-name">${u.name}</div>
                <div class="s-desc">${u.desc}${u.noSuffix ? '' : ' (레벨당)'}</div>
                <div class="s-lv">Lv.${lv} / ${u.max}${u.current ? '  (' + u.current(lv) + ')' : ''}</div>
            </div>`;
        const btn = document.createElement('button');
        btn.textContent = maxed ? 'MAX' : `🪙 ${cost}`;
        btn.disabled = maxed || save.coins < cost;
        btn.onclick = () => buyUpgrade(u.id);
        item.appendChild(btn);
        grid.appendChild(item);
    });
    refreshCoinLabels();
}

function buyUpgrade(id) {
    const u = UPGRADES.find(x => x.id === id);
    const lv = upLv(id);
    if (u.city && !save.cityVisited) return;   // 대도시 맵을 열기 전에는 구매 불가
    if (lv >= u.max) return;
    const cost = upgradeCost(u, lv);
    if (save.coins < cost) return;
    save.coins -= cost;
    save.upgrades[id] = lv + 1;
    persistSave();
    renderShop();
}

function resetSaveData() {
    if (!confirm('코인과 모든 영구 강화, 최고 기록이 삭제됩니다. 정말 초기화할까요?')) return;
    save = { coins: 0, upgrades: {}, bestTime: 0, bestKills: 0, bestLevel: 0, runs: 0, clearedBase: false, clearedCity: false, cityVisited: false, pets: {}, equippedPet: null, chars: {} };
    persistSave();
    renderShop();
}

// =====================================================================
//  화면 크기 맞춤 (PC/모바일 공통) + 모바일 터치 조이스틱
// =====================================================================
const GAME_BOX_W = 808, GAME_BOX_H = 608;   // 캔버스 800x600 + 테두리 4px x 2
const MAX_SCALE = 2;                         // 큰 모니터에서 최대 확대 배율

function fitGame() {
    const vv = window.visualViewport;
    const w = vv ? vv.width : window.innerWidth;
    const h = vv ? vv.height : window.innerHeight;
    const container = document.getElementById('game-container');

    if (IS_TOUCH_DEVICE) {
        // 모바일: 게임이 기기 화면 전체를 채움. 세로 범위는 TOUCH_VIEW_H로 고정하고 가로는 화면 비율에 맞춤
        const viewH = TOUCH_VIEW_H;
        const viewW = Math.max(320, Math.round(viewH * (w / h)));
        container.classList.add('touch-fill');
        container.style.transform = 'none';
        if (canvas.width !== viewW || canvas.height !== viewH) {
            canvas.width = viewW;
            canvas.height = viewH;
            ctx.imageSmoothingEnabled = false;
        }
    } else {
        // PC: 기존처럼 800x600 게임 화면을 창 크기에 맞춰 가운데에 확대/축소
        const s = Math.min(w / GAME_BOX_W, h / GAME_BOX_H, MAX_SCALE);
        container.classList.remove('touch-fill');
        container.style.transform = `translate(-50%, -50%) scale(${s})`;
        if (canvas.width !== 800 || canvas.height !== 600) {
            canvas.width = 800;
            canvas.height = 600;
            ctx.imageSmoothingEnabled = false;
        }
    }
}
window.addEventListener('resize', fitGame);
window.addEventListener('orientationchange', () => setTimeout(fitGame, 200));
if (window.visualViewport) window.visualViewport.addEventListener('resize', fitGame);
['fullscreenchange', 'webkitfullscreenchange'].forEach(ev =>
    document.addEventListener(ev, () => { refreshFsButton(); setTimeout(fitGame, 150); }));

function isPortraitBlocked() {
    return window.matchMedia && window.matchMedia('(pointer: coarse) and (orientation: portrait)').matches;
}

const IS_TOUCH_DEVICE = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

// ===== 모바일 화면 설정 =====
const TOUCH_VIEW_H = 430;        // 모바일에서 세로로 보이는 게임 범위(값이 작을수록 캐릭터/몬스터가 크게 보임)
const UI_SCALE = IS_TOUCH_DEVICE ? 1.3 : 1;   // 모바일에서 정보 패널 글씨 배율
const ITEM_SCALE = IS_TOUCH_DEVICE ? 1.6 : 1; // 모바일에서 필드 아이템 크기 배율
const ARROW_MAX = 4;             // 화면 밖 아이템 화살표 최대 개수
const OUTLINE_MONSTERS = ['Violet'];  // 하얀 테두리를 씌울 몬스터 이름 목록
const OUTLINE_WIDTH = 1;              // 테두리 두께(px)

// 화면을 터치한 곳에 조이스틱이 생기고, 드래그한 방향으로 이동합니다.
const joystick = { active: false, id: null, baseX: 0, baseY: 0, knobX: 0, knobY: 0, dx: 0, dy: 0, moving: false };
const JOY_RADIUS = 55;   // 조이스틱 반지름 (게임 화면 기준 px)
const JOY_DEADZONE = 8;  // 이 거리보다 가까우면 움직이지 않음

function resetJoystick() {
    joystick.active = false; joystick.id = null; joystick.moving = false;
    joystick.dx = 0; joystick.dy = 0;
}

function touchToCanvas(t) {
    const r = canvas.getBoundingClientRect();
    return {
        x: (t.clientX - r.left) * (canvas.width / r.width),
        y: (t.clientY - r.top) * (canvas.height / r.height)
    };
}

function updateJoystick(p) {
    const vx = p.x - joystick.baseX, vy = p.y - joystick.baseY;
    const dist = Math.hypot(vx, vy);
    joystick.moving = dist > JOY_DEADZONE;
    if (dist > 0) { joystick.dx = vx / dist; joystick.dy = vy / dist; }
    const k = Math.min(dist, JOY_RADIUS);
    joystick.knobX = joystick.baseX + (dist > 0 ? (vx / dist) * k : 0);
    joystick.knobY = joystick.baseY + (dist > 0 ? (vy / dist) * k : 0);
}

// 조이스틱: 게임 화면 어디든 터치하면 그 자리가 조이스틱 중심이 됨 (버튼, 창, 메뉴 제외)
function isUiTarget(el) {
    return !!(el && el.closest && el.closest('button, .modal:not(.hidden), #rotate-hint'));
}

window.addEventListener('touchstart', e => {
    if (gameState !== 'PLAYING' || isUiTarget(e.target)) return;
    e.preventDefault();
    if (joystick.active) return;
    const t = e.changedTouches[0];
    const p = touchToCanvas(t);
    joystick.active = true;
    joystick.id = t.identifier;
    joystick.baseX = joystick.knobX = p.x;
    joystick.baseY = joystick.knobY = p.y;
    joystick.dx = joystick.dy = 0;
    joystick.moving = false;
}, { passive: false });

window.addEventListener('touchmove', e => {
    if (!joystick.active) return;
    e.preventDefault();
    for (const t of e.changedTouches) {
        if (t.identifier === joystick.id) updateJoystick(touchToCanvas(t));
    }
}, { passive: false });

function endTouch(e) {
    for (const t of e.changedTouches) {
        if (t.identifier === joystick.id) resetJoystick();
    }
}
window.addEventListener('touchend', endTouch);
window.addEventListener('touchcancel', endTouch);

// iOS 사파리 핀치 줌 방지
['gesturestart', 'gesturechange', 'gestureend'].forEach(ev =>
    document.addEventListener(ev, e => e.preventDefault()));

// 조이스틱과 안내 문구 그리기 (화면 고정 좌표)
function renderTouchUI() {
    if (IS_TOUCH_DEVICE && gameTime < 8 && !joystick.active) {
        ctx.save();
        ctx.font = '14px Arial';
        ctx.textAlign = 'center';
        ctx.fillStyle = '#fff';
        ctx.globalAlpha = Math.max(0, Math.min(1, (8 - gameTime) / 2));
        ctx.fillText('화면을 터치한 채로 드래그하면 이동해요', canvas.width / 2, canvas.height - 28);
        ctx.restore();
    }
    if (!joystick.active) return;
    ctx.save();
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(joystick.baseX, joystick.baseY, JOY_RADIUS, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 0.55;
    ctx.beginPath();
    ctx.arc(joystick.knobX, joystick.knobY, 24, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
}

// =====================================================================
//  로딩 화면: 이미지와 폰트를 모두 받은 뒤에 시작 화면을 보여줍니다
// =====================================================================
const LOAD_TIMEOUT_MS = 20000;   // 파일 하나가 이 시간(ms) 넘게 안 받아지면 기다리지 않고 진행
const MIN_LOADING_MS = 400;      // 너무 빨리 끝나도 로딩 화면이 깜빡이지 않도록 최소 표시 시간
const charImages = {};           // 캐릭터별로 미리 불러둔 이미지
const charBulletImages = {};     // 캐릭터별 공격 이미지
let playerBulletImg = null;      // 지금 선택한 캐릭터의 공격 이미지

function waitForImage(img) {
    return new Promise(resolve => {
        if (img.complete) { resolve(); return; }          // 이미 받았거나(실패 포함) 끝난 경우
        img.addEventListener('load', resolve, { once: true });
        img.addEventListener('error', resolve, { once: true });   // 실패해도 게임은 진행 (대체 도형 사용)
    });
}

function waitForFont(spec, sampleText) {
    if (!(document.fonts && document.fonts.load)) return Promise.resolve();
    return document.fonts.load(spec, sampleText).catch(() => {});
}

function startPreload() {
    // 캐릭터 이미지는 선택 순간이 아니라 여기서 미리 받아 둡니다
    Object.entries(CHARACTERS).forEach(([id, c]) => {
        const im = new Image();
        im.src = c.image;
        charImages[id] = im;

        const bi = new Image();
        if (c.bulletImage) bi.src = c.bulletImage;
        charBulletImages[id] = bi;
    });

    const images = [
        laserBeamImg, laserHitImg, tornadoImg, helpAngelImg, poisonImg, ...Object.values(petImgs), towerImg, boomerImg,
        expGemImg1, expGemImg2, expGemImg3, expGemImg4, expGemImg5, expGemImg6, expGemImg7,
        ...bgImages, ...cityBgImages,
        ...Object.values(ENEMY_IMAGES).filter(Boolean),
        ...Object.values(charImages),
        ...Object.values(charBulletImages)
    ];
    const fonts = [
        ["38px 'TillVictoryComes'", '로판 세계는 오늘도 마물 퇴치중 ABC'],
        ["26px 'GangwonEducationSaeum'", '빨리 처리하고 밥 먹자 이 몸이 해결하겠다 후 귀찮은 일이 생겼군요 잡아줄테니 걱정말라냥'],
        ["26px 'HsSantoki'", '보스 처치 HP 회복 필드 아이템 획득 등장 부활 하트 자석 무적']
    ];

    const tasks = [
        ...images.map(waitForImage),
        ...fonts.map(([spec, text]) => waitForFont(spec, text))
    ];

    const total = tasks.length;
    let done = 0;
    const startedAt = Date.now();
    const fillEl = document.getElementById('loading-fill');
    const textEl = document.getElementById('loading-text');

    function updateProgress() {
        const pct = Math.round((done / total) * 100);
        fillEl.style.width = pct + '%';
        textEl.textContent = `${pct}%  (${done}/${total})`;
    }
    updateProgress();

    const withTimeout = p => Promise.race([
        p,
        new Promise(resolve => setTimeout(() => resolve('timeout'), LOAD_TIMEOUT_MS))
    ]);

    Promise.all(tasks.map(t =>
        withTimeout(t)
            .catch(() => {})
            .then(r => { if (r === 'timeout') console.warn('일부 파일이 오래 걸려 먼저 시작합니다.'); done++; updateProgress(); })
    )).then(() => {
        const wait = Math.max(0, MIN_LOADING_MS - (Date.now() - startedAt));
        setTimeout(() => {
            document.getElementById('loading-screen').classList.add('hidden');
            document.getElementById('start-modal').classList.remove('hidden');
        }, wait);
    });
}

// ===== 전체화면 (안드로이드 크롬 등 지원 기기) =====
// 아이폰 사파리는 웹페이지 전체화면을 지원하지 않아서, 버튼 대신 '홈 화면에 추가' 후 실행하면 주소창 없이 열립니다.
function fullscreenSupported() {
    const el = document.documentElement;
    const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
    return !isIOS && !!(el.requestFullscreen || el.webkitRequestFullscreen);
}
function isFullscreenNow() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
}
function toggleFullscreen() {
    const el = document.documentElement;
    if (!isFullscreenNow()) {
        const req = el.requestFullscreen || el.webkitRequestFullscreen;
        try { const p = req.call(el); if (p && p.catch) p.catch(() => {}); } catch (e) {}
        try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {}); } catch (e) {}
    } else {
        const ex = document.exitFullscreen || document.webkitExitFullscreen;
        if (ex) ex.call(document);
    }
}
function refreshFsButton() {
    const b = document.getElementById('fs-toggle');
    if (b) b.textContent = isFullscreenNow() ? '🗗' : '⛶';
}

// 초기 화면 구성
if (IS_TOUCH_DEVICE && fullscreenSupported()) document.getElementById('fs-toggle').classList.remove('hidden');
fitGame();
buildCharacterGrid();
refreshCoinLabels();
updateCityButton();
document.getElementById('stats-toggle').classList.toggle('off', !showStats);
startPreload();
</script>
